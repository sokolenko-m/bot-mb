<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Звіт по завантаженості</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css" />
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/uk.js"></script>
<style>
  :root {
    --bg: #F1F1F0;
    --surface: #FFFFFF;
    --surface-alt: #ECEBEA;
    --text: #201C1A;
    --hint: #8B8886;
    --accent: #D7000F;
    --accent-soft: #F6D3D5;
    --dark: #1C1917;
    --dark-text: #FFFFFF;
    --border: #E1E0DE;
    --success: #5B5754;
    --danger: #D7000F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 16px 14px 40px;
  }
  .brand { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .brand img { height: 26px; }
  h1 { font-size: 20px; font-weight: 800; margin: 4px 0 16px; letter-spacing: -0.2px; }
  .card {
    background: var(--surface);
    border-radius: 26px;
    padding: 18px 16px;
    margin-bottom: 14px;
    box-shadow: 0 10px 28px rgba(20, 20, 20, 0.08);
  }
  .field-list { display: flex; flex-direction: column; gap: 10px; }
  .field-row {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface-alt); border-radius: 18px; padding: 11px 14px;
  }
  .field-row .icon {
    width: 36px; height: 36px; min-width: 36px; border-radius: 50%; background: var(--surface);
    display: flex; align-items: center; justify-content: center; color: var(--hint);
  }
  .field-row .field-content { flex: 1; min-width: 0; }
  .field-row .field-label {
    font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em;
    color: var(--hint); margin-bottom: 2px;
  }
  .select-wrap { position: relative; }
  .select-wrap:after {
    content: ""; position: absolute; right: 3px; top: 44%; width: 8px; height: 8px;
    border-right: 2px solid var(--hint); border-bottom: 2px solid var(--hint);
    transform: translateY(-55%) rotate(45deg); pointer-events: none;
  }
  select, input[type=text] {
    width: 100%; padding: 0; border: none; border-radius: 0;
    background: transparent; color: var(--text); font-size: 15px; font-family: inherit; font-weight: 700;
    appearance: none; -webkit-appearance: none;
  }
  select { padding-right: 18px; cursor: pointer; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .chip.active { background: var(--dark); color: var(--dark-text); border-color: var(--dark); }
  .presets { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .preset-btn {
    padding: 8px 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 12.5px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  .preset-btn.active { background: var(--accent); color: var(--dark-text); border-color: var(--accent); }

  .report-actions { margin-top: 18px; }
  .report-actions .swipe-track { display: none; }
  .report-actions .primary-btn { display: flex; }
  .report-actions.mobile .swipe-track { display: block; }
  .report-actions.mobile .primary-btn { display: none; }

  .swipe-track {
    position: relative; width: 100%; height: 54px; border-radius: 999px;
    background: var(--dark); overflow: hidden; user-select: none; isolation: isolate;
  }
  .primary-btn {
    width: 100%; padding: 8px 8px 8px 22px; border: none; border-radius: 999px;
    background: var(--dark); color: var(--dark-text); font-size: 15.5px; font-weight: 700; cursor: pointer;
    font-family: inherit; align-items: center; justify-content: space-between; gap: 10px;
  }
  .primary-btn:disabled { opacity: .5; cursor: default; }
  .primary-btn:hover:not(:disabled) { background: #000; }
  .btn-arrow {
    width: 34px; height: 34px; min-width: 34px; border-radius: 50%; background: var(--dark-text);
    color: var(--dark); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800;
  }
  .swipe-track:before {
    content: ""; position: absolute; inset: 0; z-index: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .14) 50%, transparent 70%);
    background-size: 220% 100%; animation: swipe-shimmer 2.6s ease-in-out infinite;
  }
  .swipe-track.disabled { opacity: .55; }
  .swipe-track.disabled:before, .swipe-track.dragging:before { animation-play-state: paused; }
  .swipe-fill {
    position: absolute; left: 0; top: 0; bottom: 0; z-index: 1; width: 50px;
    background: var(--accent); border-radius: 999px;
  }
  .swipe-track.dragging .swipe-fill, .swipe-track.confirmed .swipe-fill { transition: none; }
  .swipe-fill.animated { transition: width .28s cubic-bezier(.2, .8, .2, 1); }
  .swipe-label {
    position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center;
    color: var(--dark-text); font-size: 15.5px; font-weight: 700; pointer-events: none;
  }
  .swipe-thumb {
    position: absolute; left: 4px; top: 4px; z-index: 2; width: 46px; height: 46px; border-radius: 50%;
    background: var(--dark-text); color: var(--dark); display: flex; align-items: center; justify-content: center;
    font-size: 18px; font-weight: 800; touch-action: none; cursor: grab; will-change: transform;
  }
  .swipe-thumb.animated { transition: transform .28s cubic-bezier(.2, .8, .2, 1); }
  .swipe-track.dragging .swipe-thumb { cursor: grabbing; }
  @keyframes swipe-shimmer {
    0% { background-position: 130% 0; }
    100% { background-position: -90% 0; }
  }
  .export-row { display: flex; gap: 8px; margin-top: 12px; }
  .export-row button {
    flex: 1; padding: 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-alt); color: var(--text); font-size: 13.5px; font-weight: 700; cursor: pointer;
    font-family: inherit;
  }
  #summary { font-size: 14px; }
  #summary > div:first-child { color: var(--hint); font-weight: 700; margin-bottom: 6px; }
  #summary b { font-size: 22px; font-weight: 800; color: var(--accent); }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; min-width: 560px; border-collapse: collapse; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); vertical-align: top; white-space: nowrap; }
  th:nth-child(3), td:nth-child(3) { white-space: normal; min-width: 200px; }
  th { color: var(--hint); font-weight: 700; text-transform: uppercase; font-size: 10.5px; letter-spacing: .04em; }
  td { font-weight: 600; }
  .status-done { color: var(--success); }
  .status-open { color: var(--danger); }
  .status-planned { color: var(--hint); }
  .status-paused { color: #B45309; }
  tr.row-new td { background: #FFF3CD; }
  tr.row-absence td { background: #EDEDED; color: var(--hint); }
  .absence-line { margin-top: 6px; font-size: 13px; font-weight: 600; color: var(--hint); }
  .absence-line .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #EDEDED; border: 1px solid #D5D5D5; margin-right: 6px; vertical-align: middle; }
  .scheduler-line { margin-top: 10px; font-size: 12px; font-weight: 700; color: var(--hint); }
  .scheduler-line.stale { color: var(--danger); }
  .origin-breakdown { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; font-weight: 600; }
  .origin-breakdown .legend-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: #FFF3CD; margin-right: 6px; vertical-align: middle; }
  .origin-breakdown div { margin-top: 3px; }
  #msg { margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--hint); min-height: 18px; }
  #msg.error { color: var(--danger); }
  #msg.ok { color: var(--success); }
  .hint { margin-top: 10px; font-size: 12.5px; font-weight: 600; color: var(--hint); }

  .flatpickr-calendar {
    background: var(--surface); border: none; border-radius: 22px;
    box-shadow: 0 18px 40px rgba(20, 20, 20, .22); font-family: "Nunito", sans-serif;
    padding: 10px; width: auto;
  }
  .flatpickr-calendar.arrowTop:before, .flatpickr-calendar.arrowTop:after,
  .flatpickr-calendar.arrowBottom:before, .flatpickr-calendar.arrowBottom:after { display: none; }
  .flatpickr-months { padding: 4px 2px 8px; }
  .flatpickr-current-month { font-size: 15px; font-weight: 800; color: var(--text); }
  .flatpickr-current-month .flatpickr-monthDropdown-months,
  .flatpickr-current-month input.cur-year { font-weight: 800; color: var(--text); background: transparent; font-family: inherit; }
  .flatpickr-current-month .flatpickr-monthDropdown-months:hover { background: var(--surface-alt); }
  .flatpickr-prev-month, .flatpickr-next-month { fill: var(--hint); color: var(--hint); }
  .flatpickr-prev-month:hover svg, .flatpickr-next-month:hover svg { fill: var(--text); }
  span.flatpickr-weekday { color: var(--hint); font-weight: 800; font-size: 10.5px; text-transform: uppercase; }
  .flatpickr-day { color: var(--text); font-weight: 700; border-radius: 50%; border-color: transparent; }
  .flatpickr-day.flatpickr-disabled, .flatpickr-day.flatpickr-disabled:hover,
  .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay,
  .flatpickr-day.notAllowed, .flatpickr-day.notAllowed.prevMonthDay, .flatpickr-day.notAllowed.nextMonthDay {
    color: var(--hint); opacity: .4;
  }
  .flatpickr-day:hover, .flatpickr-day.prevMonthDay:hover, .flatpickr-day.nextMonthDay:hover {
    background: var(--accent-soft); border-color: var(--accent-soft); color: var(--text);
  }
  .flatpickr-day.today { border-color: var(--accent); }
  .flatpickr-day.inRange, .flatpickr-day.prevMonthDay.inRange, .flatpickr-day.nextMonthDay.inRange {
    background: var(--accent-soft) !important; border-color: var(--accent-soft) !important; color: var(--text);
    box-shadow: -5px 0 0 var(--accent-soft), 5px 0 0 var(--accent-soft);
  }
  .flatpickr-day.selected, .flatpickr-day.startRange, .flatpickr-day.endRange {
    background: var(--dark) !important; border-color: var(--dark) !important; color: var(--dark-text) !important; box-shadow: none;
  }
  .flatpickr-day.selected.startRange + .endRange:not(:nth-child(7n+1)),
  .flatpickr-day.startRange.startRange + .endRange:not(:nth-child(7n+1)),
  .flatpickr-day.endRange.startRange + .endRange:not(:nth-child(7n+1)) {
    box-shadow: -10px 0 0 var(--dark);
  }
  .flatpickr-day.startRange { border-radius: 50% 0 0 50%; }
  .flatpickr-day.endRange { border-radius: 0 50% 50% 0; }
</style>
</head>
<body>
  <div class="brand"><img src="/assets/logo.png" alt="МаксіБуд" /></div>
  <h1>Звіт по завантаженості конструктора</h1>

  <div class="card">
    <div class="field-list">
      <div class="field-row">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5 20c0-3.5 3-6 7-6s7 2.5 7 6"/></svg>
        </span>
        <div class="field-content">
          <div class="field-label">Конструктор</div>
          <div class="select-wrap">
            <select id="constructor"><option>Завантаження...</option></select>
          </div>
        </div>
      </div>

      <div class="field-row">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.5 7-11.5A7 7 0 0 0 5 9.5C5 14.5 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.3"/></svg>
        </span>
        <div class="field-content">
          <div class="field-label">Об'єкт</div>
          <div class="chips" id="object-chips"></div>
        </div>
      </div>

      <div class="field-row" id="period-section">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="16" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>
        </span>
        <div class="field-content">
          <div class="field-label">Період</div>
          <input type="text" id="dateRangeInput" placeholder="Оберіть період" readonly />
        </div>
      </div>
    </div>

    <div class="presets">
      <button class="preset-btn" data-preset="today">Сьогодні</button>
      <button class="preset-btn" data-preset="this-week">Цей тиждень</button>
      <button class="preset-btn" data-preset="next-week">Наступний тиждень</button>
      <button class="preset-btn" data-preset="this-month">Цей місяць</button>
      <button class="preset-btn" data-preset="next-month">Наступний місяць</button>
      <button class="preset-btn" data-preset="last-month">Минулий місяць</button>
    </div>
    <div id="object-note" class="hint" hidden>Буде показано весь період роботи конструктора на обраних об'єктах.</div>

    <div class="report-actions" id="report-actions">
      <div class="swipe-track" id="swipe-track" role="button" tabindex="0" aria-label="Сформувати звіт, свайпніть повзунок праворуч">
        <div class="swipe-fill" id="swipe-fill"></div>
        <div class="swipe-label" id="swipe-label">Сформувати звіт</div>
        <div class="swipe-thumb" id="swipe-thumb">→</div>
      </div>
      <button class="primary-btn" id="btn-report-desktop" type="button">
        <span>Сформувати звіт</span><span class="btn-arrow">→</span>
      </button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card" id="summary" hidden></div>

  <div class="card" id="results-card" hidden>
    <div class="export-row" id="export-row" hidden>
      <button id="btn-xlsx">Завантажити Excel</button>
      <button id="btn-pdf">Завантажити PDF</button>
    </div>

    <div class="table-wrap">
      <table id="table" hidden>
        <thead>
          <tr><th>№</th><th>Об'єкт</th><th>Найменування задачі</th><th>Тип</th><th>Додано</th><th>Початок</th><th>Кінець</th><th>План, год</th><th>Факт, год</th><th>Статус</th></tr>
        </thead>
        <tbody id="table-body"></tbody>
      </table>
    </div>
  </div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg?.initData || "";

const $ = (s) => document.querySelector(s);
let currentReport = null;
let currentConstructorName = "";
let currentPeriodLabel = "";
const selectedObjectIds = new Set();
let objectNamesById = {};

function pad(n) { return String(n).padStart(2, "0"); }
function toDateStr(d) { return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; }

const fp = flatpickr("#dateRangeInput", {
  mode: "range",
  dateFormat: "d.m.Y",
  locale: (typeof flatpickr !== "undefined" && flatpickr.l10ns.uk) ? "uk" : undefined,
});
fp.l10n.rangeSeparator = " – ";

function setPreset(preset) {
  const now = new Date();
  let start, end;
  if (preset === "today") {
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
  } else if (preset === "this-week") {
    const day = (now.getDay() + 6) % 7; // Monday=0
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day);
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 7);
  } else if (preset === "next-week") {
    const day = (now.getDay() + 6) % 7;
    start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 7);
    end = new Date(now.getFullYear(), now.getMonth(), now.getDate() - day + 14);
  } else if (preset === "this-month") {
    start = new Date(now.getFullYear(), now.getMonth(), 1);
    end = new Date(now.getFullYear(), now.getMonth() + 1, 1);
  } else if (preset === "next-month") {
    start = new Date(now.getFullYear(), now.getMonth() + 1, 1);
    end = new Date(now.getFullYear(), now.getMonth() + 2, 1);
  } else if (preset === "last-month") {
    start = new Date(now.getFullYear(), now.getMonth() - 1, 1);
    end = new Date(now.getFullYear(), now.getMonth(), 1);
  }
  // кінцева дата пресетів обчислена як "до наступного дня" (ексклюзивно) —
  // для показу в календарі віднімаємо 1 день, для фільтра на бекенді лишаємо як є
  const endInclusive = new Date(end.getFullYear(), end.getMonth(), end.getDate() - 1);
  fp.setDate([start, endInclusive], true);
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.toggle("active", b.dataset.preset === preset));
}

document.querySelectorAll(".preset-btn").forEach((b) => b.addEventListener("click", () => setPreset(b.dataset.preset)));
setPreset("this-month");

fp.config.onChange.push(() => {
  document.querySelectorAll(".preset-btn").forEach((b) => b.classList.remove("active"));
});

async function api(path, options = {}) {
  const resp = await fetch(path, {
    ...options,
    headers: { "Content-Type": "application/json", "X-Telegram-Init-Data": initData, ...(options.headers || {}) },
  });
  const data = await resp.json();
  if (!resp.ok) throw new Error(data.error || `Помилка ${resp.status}`);
  return data;
}

function showMsg(text, kind) {
  const el = $("#msg");
  el.textContent = text || "";
  el.className = kind || "";
}

async function loadConstructors() {
  const sel = $("#constructor");
  try {
    const list = await api("/api/constructors");
    sel.innerHTML = list.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join("");
    if (list.length === 0) sel.innerHTML = "<option>Не знайдено</option>";
    else loadObjects(sel.value);
  } catch (e) {
    sel.innerHTML = "<option>Помилка завантаження</option>";
    showMsg(e.message, "error");
  }
}

function renderObjectChips(list) {
  objectNamesById = Object.fromEntries(list.map((o) => [o.id, o.name]));
  selectedObjectIds.clear();
  const container = $("#object-chips");
  container.innerHTML = "";
  const allChip = document.createElement("button");
  allChip.className = "chip active";
  allChip.textContent = "Всі об'єкти (за період)";
  allChip.dataset.id = "";
  container.appendChild(allChip);
  for (const o of list) {
    const chip = document.createElement("button");
    chip.className = "chip";
    chip.textContent = o.name;
    chip.dataset.id = o.id;
    container.appendChild(chip);
  }
  container.querySelectorAll(".chip").forEach((chip) => chip.addEventListener("click", () => onChipClick(chip)));
  applyObjectMode();
}

function onChipClick(chip) {
  const id = chip.dataset.id;
  if (id === "") {
    selectedObjectIds.clear();
  } else {
    if (selectedObjectIds.has(id)) selectedObjectIds.delete(id);
    else selectedObjectIds.add(id);
    if (selectedObjectIds.size === 0) {
      // нічого не обрано — повертаємось у режим "всі об'єкти"
    }
  }
  document.querySelectorAll("#object-chips .chip").forEach((c) => {
    const active = c.dataset.id === "" ? selectedObjectIds.size === 0 : selectedObjectIds.has(c.dataset.id);
    c.classList.toggle("active", active);
  });
  applyObjectMode();
}

async function loadObjects(constructorId) {
  const container = $("#object-chips");
  container.innerHTML = "";
  if (!constructorId) return;
  try {
    const list = await api(`/api/objects?constructorId=${encodeURIComponent(constructorId)}`);
    renderObjectChips(list);
  } catch (e) {
    showMsg(e.message, "error");
  }
}

function applyObjectMode() {
  const isObjectMode = selectedObjectIds.size > 0;
  $("#period-section").hidden = isObjectMode;
  $("#object-note").hidden = !isObjectMode;
}

$("#constructor").addEventListener("change", (e) => loadObjects(e.target.value));

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// Дати показуємо за київським часом незалежно від налаштувань телефону.
function formatDateShort(iso) {
  if (!iso) return "";
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) { const [, m, d] = iso.split("-"); return `${d}.${m}`; }
  return new Date(iso).toLocaleDateString("uk-UA", { day: "2-digit", month: "2-digit", timeZone: "Europe/Kyiv" });
}

function schedulerLine(s) {
  if (!s) return `<div class="scheduler-line">Планувальник: немає даних про останній цикл</div>`;
  const m = s.minutesAgo;
  let ago;
  if (m < 1) ago = "щойно";
  else if (m < 60) ago = `${m} хв тому`;
  else if (m < 48 * 60) ago = `${Math.floor(m / 60)} год ${m % 60} хв тому`;
  else ago = new Date(s.lastCycle).toLocaleString("uk-UA", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Kyiv" });
  const warn = s.stale ? " — дати в звіті можуть бути неактуальні" : "";
  return `<div class="scheduler-line${s.stale ? " stale" : ""}">Планувальник: останній цикл ${ago}${warn}</div>`;
}

const STATUS_CLASS = { "Виконано": "status-done", "В роботі": "status-open", "Заплановано": "status-planned", "На паузі": "status-paused", "Відсутність": "status-planned" };

function currentRequestPayload() {
  const constructorId = $("#constructor").value;
  if (selectedObjectIds.size > 0) {
    const objectIds = [...selectedObjectIds];
    const objectNames = objectIds.map((id) => objectNamesById[id]).join(", ");
    return { constructorId, objectIds, objectNames };
  }
  const dates = fp.selectedDates;
  if (dates.length < 2) return null;
  const startDate = toDateStr(dates[0]);
  const endExclusive = new Date(dates[1].getFullYear(), dates[1].getMonth(), dates[1].getDate() + 1);
  const endDate = toDateStr(endExclusive);
  return { constructorId, startDate, endDate };
}

function isDesktopPlatform() {
  const platform = tg?.platform;
  if (platform && platform !== "unknown") {
    return !["android", "android_x", "ios"].includes(platform);
  }
  return window.matchMedia("(pointer: fine)").matches && !("ontouchstart" in window);
}
const isDesktop = isDesktopPlatform();
$("#report-actions").classList.toggle("mobile", !isDesktop);

function setBusy(isBusy) {
  if (isDesktop) {
    $("#btn-report-desktop").disabled = isBusy;
  } else {
    swipe.setDisabled(isBusy);
    if (!isBusy) swipe.reset();
  }
}

async function submitReport() {
  const payload = currentRequestPayload();
  if (!payload) {
    showMsg("Оберіть конструктора та період (або об'єкт).", "error");
    return;
  }
  currentConstructorName = $("#constructor").selectedOptions[0]?.textContent || "";

  showMsg("Формую звіт...");
  setBusy(true);
  try {
    const report = await api("/api/report", { method: "POST", body: JSON.stringify(payload) });
    currentReport = report;
    currentPeriodLabel = report.periodLabel;
    renderReport(report);
    showMsg("");
  } catch (e) {
    showMsg(e.message, "error");
  } finally {
    setBusy(false);
  }
}

function setupSwipe(trackEl, thumbEl, fillEl, labelEl, onConfirm) {
  const THUMB_SIZE = 46;
  const PADDING = 4;
  const THRESHOLD = 0.72;
  let dragging = false;
  let startClientX = 0;
  let thumbX = 0;
  let maxX = 0;

  function recalc() {
    maxX = Math.max(0, trackEl.clientWidth - THUMB_SIZE - PADDING * 2);
  }

  function place(x, animated) {
    thumbX = Math.max(0, Math.min(maxX, x));
    thumbEl.classList.toggle("animated", animated);
    fillEl.classList.toggle("animated", animated);
    thumbEl.style.transform = `translateX(${thumbX}px)`;
    fillEl.style.width = `${PADDING * 2 + THUMB_SIZE + thumbX}px`;
    const progress = maxX > 0 ? thumbX / maxX : 0;
    labelEl.style.opacity = String(Math.max(0, 1 - progress * 1.6));
  }

  function onDown(e) {
    if (trackEl.classList.contains("disabled")) return;
    dragging = true;
    trackEl.classList.add("dragging");
    recalc();
    startClientX = e.clientX - thumbX;
    try { thumbEl.setPointerCapture(e.pointerId); } catch (err) {}
  }
  function onMove(e) {
    if (!dragging) return;
    place(e.clientX - startClientX, false);
  }
  function onUp() {
    if (!dragging) return;
    dragging = false;
    trackEl.classList.remove("dragging");
    if (maxX > 0 && thumbX >= maxX * THRESHOLD) {
      place(maxX, true);
      onConfirm();
    } else {
      place(0, true);
    }
  }

  thumbEl.addEventListener("pointerdown", onDown);
  window.addEventListener("pointermove", onMove);
  window.addEventListener("pointerup", onUp);
  window.addEventListener("pointercancel", onUp);
  trackEl.addEventListener("keydown", (e) => {
    if ((e.key === "Enter" || e.key === " ") && !trackEl.classList.contains("disabled")) {
      e.preventDefault();
      place(maxX, true);
      onConfirm();
    }
  });
  window.addEventListener("resize", () => { recalc(); place(thumbX, false); });
  recalc();

  return {
    setDisabled: (v) => trackEl.classList.toggle("disabled", v),
    reset: () => place(0, true),
  };
}

const swipe = setupSwipe($("#swipe-track"), $("#swipe-thumb"), $("#swipe-fill"), $("#swipe-label"), submitReport);
$("#btn-report-desktop").addEventListener("click", submitReport);

function renderReport(report) {
  $("#summary").hidden = false;
  let summaryHtml = `<div>${escapeHtml(report.periodLabel)}</div><b>${report.totals.plannedHours} год</b> план · <b>${report.totals.factHours} год</b> факт · задач: ${report.totals.count}`;
  const o = report.totals.byOrigin;
  if (o) {
    summaryHtml += `<div class="origin-breakdown">
      <div>Заплановано заздалегідь: ${o.planned.count} задач, ${o.planned.hours} год</div>
      <div><span class="legend-dot"></span>Додано протягом місяця: ${o.added.count} задач, ${o.added.hours} год</div>
      <div>Всього: ${o.planned.count + o.added.count} задач, ${o.totalHours} год</div>
    </div>`;
  }
  const a = report.totals.absence;
  if (a) {
    summaryHtml += `<div class="absence-line"><span class="legend-dot"></span>Відсутність (відпустка тощо): ${a.hours} год — не входить у підсумки</div>`;
  }
  summaryHtml += schedulerLine(report.scheduler);
  $("#summary").innerHTML = summaryHtml;

  $("#results-card").hidden = report.tasks.length === 0;
  $("#export-row").hidden = report.tasks.length === 0;

  const tbody = $("#table-body");
  if (report.tasks.length === 0) {
    $("#table").hidden = true;
    return;
  }
  $("#table").hidden = false;
  tbody.innerHTML = report.tasks
    .map(
      (t) => `<tr class="${t.isAbsence ? "row-absence" : t.isNew ? "row-new" : ""}">
        <td>${t.order !== null && t.order !== undefined ? Math.round(t.order * 10) / 10 : ""}</td>
        <td>${escapeHtml(t.objectName || "—")}</td>
        <td>${escapeHtml(t.title)}</td>
        <td>${escapeHtml(t.taskType || "")}</td>
        <td>${formatDateShort(t.originCreatedTime || t.createdTime)}</td>
        <td>${formatDateShort(t.start)}</td>
        <td>${formatDateShort(t.end)}</td>
        <td>${t.plannedHours ?? ""}</td>
        <td>${t.factHours ?? ""}</td>
        <td class="${STATUS_CLASS[t.status] || ""}">${t.status}</td>
      </tr>`
    )
    .join("");
}

async function doExport(format) {
  if (!currentReport) return;
  const payload = currentRequestPayload();
  if (!payload) return;
  showMsg("Готую файл і надсилаю в чат...");
  try {
    await api("/api/export", {
      method: "POST",
      body: JSON.stringify({ ...payload, constructorName: currentConstructorName, format }),
    });
    showMsg("Надіслано вам у чат з ботом ✓", "ok");
    tg?.HapticFeedback?.notificationOccurred("success");
  } catch (e) {
    showMsg(e.message, "error");
  }
}

$("#btn-xlsx").addEventListener("click", () => doExport("xlsx"));
$("#btn-pdf").addEventListener("click", () => doExport("pdf"));

loadConstructors();
</script>
